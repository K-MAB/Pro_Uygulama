    <!-- Telefon -->
    <div class="rounded-2xl bg-white shadow p-5">
      <p class="text-sm font-semibold text-neutral-600">

      </p>

      <a

  <!-- Teklif Formu -->
  <form
    id="contactForm"
    class="rounded-2xl bg-white shadow p-5 md:p-6"
  >

    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl font-semibold">
        Teklif Al

      <span class="text-xs text-neutral-500">
        Ortalama dönüş: 1 iş günü

    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">

      <input
        name="name"
        type="text"
        required
        minlength="2"
        placeholder="Ad Soyad"
        class="rounded-xl border px-4 py-3 outline-none focus:ring-2 focus:ring-neutral-300"
      >

      <!-- E-Posta -->
      <input
        name="email"
        type="email"
        required
        placeholder="E-Posta"
        class="rounded-xl border px-4 py-3 outline-none focus:ring-2 focus:ring-neutral-300"
      >

      <!-- Telefon -->
      <input
        name="phone"
        type="tel"
        required
        placeholder="Telefon (05XX XXX XX XX)"
        pattern="[0-9]{10,11}"
        inputmode="tel"
        class="rounded-xl border px-4 py-3 outline-none focus:ring-2 focus:ring-neutral-300"
      >

      <!-- Konu -->
      <input
        name="subject"
        type="text"
        required
        placeholder="Konu"
        class="rounded-xl border px-4 py-3 outline-none focus:ring-2 focus:ring-neutral-300"
      >

    </div>

    <!-- Mesaj -->
    <textarea
      name="message"
      required
      minlength="10"
      rows="5"
      placeholder="Mesajınızı yazınız..."
      class="mt-3 w-full rounded-xl border px-4 py-3 outline-none focus:ring-2 focus:ring-neutral-300"
    ></textarea>

    <!-- Gönder -->
    <button
      type="submit"
      class="mt-4 w-full md:w-auto rounded-xl bg-cocoa px-6 py-3 font-medium text-white hover:opacity-90 transition"
    >
      Gönder
    </button>

    <!-- Form Mesajı -->
    <p id="formMsg" class="mt-3 text-sm"></p>

  </form>

</div>

  <!-- EmailJS -->

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <script>

    // EmailJS bilgileri
    const EMAILJS_PUBLIC_KEY = "6UmhzyBzX-zFrj1Pj";
    const EMAILJS_SERVICE_ID = "service_npg1sfo";
    const EMAILJS_TEMPLATE_ID = "template_353gglm";

    emailjs.init(EMAILJS_PUBLIC_KEY);

    const form = document.getElementById("contactForm");
    const msg = document.getElementById("formMsg");

    form.addEventListener("submit", async (e) => {

      e.preventDefault();

      msg.className = "mt-3 text-sm text-neutral-600";
      msg.textContent = "Gönderiliyor...";

      const data = Object.fromEntries(
        new FormData(form).entries()
      );

      emailjs.send(
        EMAILJS_SERVICE_ID,
        EMAILJS_TEMPLATE_ID,
        {
          name: data.name,
          email: data.email,
          phone: data.phone,
          subject: data.subject,
          message: data.message
        }
      )
      .then(() => {

        msg.className = "mt-3 text-sm text-emerald-700";
        msg.textContent = "Teşekkürler! Mesajınız alındı.";

        form.reset();

      })
      .catch((err) => {

        console.error(err);

        msg.className = "mt-3 text-sm text-rose-700";
        msg.textContent = "Gönderilemedi. Lütfen tekrar deneyin.";

      });

    });

  </script>

  <!-- Ortak Navbar Loader -->
